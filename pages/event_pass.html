<!DOCTYPE html>
<html>
<head>
    <title>출석보상 이벤트</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h4>출석보상 패스 이벤트 리스트</h4>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>GROUP ID</th>
            <th>CODE</th>
            <th>시작일시</th>
            <th>종료일시</th>
            <th>작업</th>
        </tr>
    </thead>
    <tbody>
    {{range .Events}}
        <tr>
            <td>{{.ID}}</td>
            <td>{{.GroupID}}</td>
            <td>{{.Code}}</td>
            <td>{{.StartDate}}</td>
            <td>{{.EndDate}}</td>
            <td><button onclick="deleteEvent('{{.ID}}')">삭제</button></td>
        </tr>
    {{end}}
    </tbody>
</table>

<hr>

<h4>출석보상패스 이벤트 추가</h4>
<form action="/actions/event_pass_add" method="post">
    <label for="group_id">GROUP ID:</label>
    <select id="group_id" name="group_id">
        <option value="GROUP1">PASS1(루비)</option>
        <option value="GROUP2">PASS2(캐릭터1)</option>
        <option value="GROUP3">PASS3(캐릭터2)</option>
    </select>
    <br><br>
    <label for="code">CODE:</label>
    <input type="text" id="code" name="code" required>
    <br><br>
    <label for="start_date">시작일시 (YYYY-MM-DD HH:mm:ss):</label>
    <input type="text" id="start_date" name="start_date" required>
    <br><br>
    <label for="end_date">종료일시 (YYYY-MM-DD HH:mm:ss):</label>
    <input type="text" id="end_date" name="end_date" required>
    <br><br>
    <button type="submit">추가</button>
</form>

<script>
    function deleteEvent(id) {
        if (confirm("ID (" + id + ") 을 지우시겠습니까?")) {
            window.location.href = "/actions/event_pass_delete?id=" + id;
        }
    }
</script>

</body>
</html>
